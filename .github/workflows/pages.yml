# Publish site/ to GitHub Pages.
#
# Pages' branch setting can only serve the repo root or /docs, and site/ is
# neither — so the folder is uploaded as an artifact instead. Nothing is built:
# the site is plain HTML and ES modules, and `atompipe site build` has already
# written site/data/state.json into the repo.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
